<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenKline Vanilla Example</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #0f172a; color: #e2e8f0; }
      main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
      #chart { height: 520px; border: 1px solid #334155; border-radius: 8px; overflow: hidden; }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenKline</h1>
      <p>Framework-independent Canvas2D candlestick chart.</p>
      <div id="chart"></div>
    </main>
    <script type="module">
      import { createChart } from "../../dist/src/index.js";

      const chart = createChart(document.querySelector("#chart"), {
        theme: "dark",
        autoSize: true,
        timeZone: "UTC",
        pricePrecision: 2,
      });
      globalThis.__openklineChart = chart;

      const start = Date.UTC(2026, 0, 1);
      const candles = Array.from({ length: 80 }, (_, index) => {
        const close = 100 + Math.sin(index / 7) * 8 + index * 0.08;
        const open = close - Math.cos(index) * 1.8;
        return {
          time: start + index * 60 * 60 * 1000,
          open,
          high: Math.max(open, close) + 2.2,
          low: Math.min(open, close) - 2.2,
          close,
          volume: 1000 + index * 13,
        };
      });
      const price = chart.addCandlestickSeries({ id: "price", title: "Price" });
      price.setData(candles);
      const trend = chart.addLineSeries({ id: "trend", title: "Trend", style: { color: "#f59e0b", lineWidth: 2 } });
      trend.setData(candles.map((candle) => ({ time: candle.time, value: candle.close + 1.5 })));
      const area = chart.addAreaSeries({ id: "area", title: "Area", style: { color: "#38bdf8", fillColor: "#38bdf8" } });
      area.setData(candles.map((candle) => ({ time: candle.time, value: candle.close - 1.5 })));
      const volume = chart.addVolumeSeries({ id: "volume", title: "Volume", style: { color: "#64748b" } });
      volume.setData(candles.map((candle) => ({ time: candle.time, value: candle.volume ?? 0 })));

      chart.subscribe("crosshairMove", ({ time, price }) => {
        document.title = time === null || price === null
          ? "OpenKline Vanilla Example"
          : `OpenKline ${price.toFixed(2)}`;
      });
    </script>
  </body>
</html>
