<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenKline Offline JSON Example</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #0f172a; color: #e2e8f0; }
      main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
      #chart { height: 520px; border: 1px solid #334155; border-radius: 8px; overflow: hidden; }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline JSON data</h1>
      <p>The candle file is bundled beside this page. No external request is made.</p>
      <div id="chart"></div>
    </main>
    <script type="module">
      import { createChart } from "../../dist/src/index.js";

      const candles = await fetch("./offline-candles.json").then((response) => {
        if (!response.ok) throw new Error(`Could not load local candle file: ${response.status}`);
        return response.json();
      });
      const chart = createChart(document.querySelector("#chart"), { theme: "dark", autoSize: true, timeZone: "UTC", pricePrecision: 2 });
      chart.setData(candles);
      chart.addIndicator("SMA", { period: 3, pane: "main" });
      chart.addDrawing("horizontal-line", { id: "offline-level", points: [{ time: candles.at(-1).time, price: candles.at(-1).close }] });
      globalThis.__openklineOfflineExample = { chart, candles };
    </script>
  </body>
</html>
