<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenKline Generic WebSocket Datafeed</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #0f172a; color: #e2e8f0; }
      main { max-width: 1100px; margin: 2rem auto; padding: 2rem 1rem; }
      #chart { height: 520px; border: 1px solid #334155; border-radius: 8px; overflow: hidden; }
    </style>
  </head>
  <body>
    <main>
      <h1>Generic WebSocket Datafeed</h1>
      <p>The socket is an injected fixture. Replace the factory and message mapping with your own server.</p>
      <div id="chart"></div>
    </main>
    <script type="module">
      import { createChart, InMemoryDatafeed, WebSocketDatafeed } from "../../dist/src/index.js";

      class FixtureSocket {
        constructor() { this.readyState = 0; this.onopen = null; this.onmessage = null; this.onerror = null; this.onclose = null; this.sent = []; this.closeCount = 0; }
        send(data) { this.sent.push(data); }
        close() { this.closeCount += 1; this.onclose?.(); }
        open() { this.readyState = 1; this.onopen?.(); }
        message(data) { this.onmessage?.({ data }); }
      }
      const start = Date.UTC(2026, 0, 1);
      const info = { symbol: "LOCAL-USD", exchange: "LOCAL", currency: "USD", timezone: "UTC", pricePrecision: 2 };
      const historical = new InMemoryDatafeed(info, [{ time: start, open: 10, high: 12, low: 9, close: 11, volume: 100 }]);
      let socket;
      const datafeed = new WebSocketDatafeed({
        url: "wss://exchange.example.invalid/candles",
        symbols: { "LOCAL-USD": info },
        historical,
        initialBackoffMs: 0,
        maxBackoffMs: 0,
        maxReconnectAttempts: 1,
        createSocket: () => { socket = new FixtureSocket(); return socket; },
        createSubscribeMessage: (args) => ({ subscribe: args.symbol, timeframe: args.timeframe }),
      });
      const chart = createChart(document.querySelector("#chart"), { theme: "dark", autoSize: true });
      const ready = chart.setDatafeed(datafeed, { symbol: info.symbol, timeframe: "1h", from: start, to: start + 3_600_000 });
      globalThis.__openklineWebSocketExample = { chart, datafeed, ready, get socket() { return socket; } };
      await ready;
      chart.addIndicator("SMA", { period: 2, pane: "main" });
    </script>
  </body>
</html>
